name: Windows checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: py -m pip install -r requirements-dev.txt pyinstaller

      - name: Create icon
        run: py scripts/create_icon.py

      - name: Ruff
        run: |
          py -m ruff check .
          py -m ruff format --check .

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: py -m pytest -m "not network"

      - name: Build executable
        run: py -m PyInstaller --noconfirm --clean LinkStatusChecker.spec

      - name: Frozen smoke test
        run: |
          dist\LinkStatusChecker.exe --smoke-test --smoke-output dist\smoke_test_result.txt
          Get-Content dist\smoke_test_result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LinkStatusChecker-Windows
          path: |
            dist/LinkStatusChecker.exe
            dist/smoke_test_result.txt
