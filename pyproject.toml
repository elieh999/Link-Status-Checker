[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test reaches the public internet and may fail offline",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # Qt method overrides such as mousePressEvent and closeEvent are camelCase
    # by definition, so naming rules would fight the framework.
    "N802",
    # The one place this fires is the frozen vs source APP_DIR choice, where the
    # suggested ternary runs past the line limit and reads worse than the if.
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
